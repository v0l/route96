name: Feature Matrix

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - ""
          - "nip96,react-ui"
          - "blossom,react-ui"
          - "blossom,nip96"
          - "blossom,nip96,payments"
          - "blossom,nip96,react-ui,payments,media-compression"
          - "nip96,blossom,react-ui,r96util,labels"

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-features-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-features-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev \
            libavfilter-dev libavdevice-dev pkg-config

      - name: Check
        run: cargo check --no-default-features --features "${{ matrix.features }}" --lib --bins --tests
