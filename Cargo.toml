[package]
name = "route96"
version = "0.8.0"
edition = "2024"

[[bin]]
name = "route96"
path = "src/bin/main.rs"

[[bin]]
name = "r96util"
path = "src/bin/r96util.rs"
required-features = ["r96util"]

[lib]
name = "route96"

[features]
default = ["nip96", "blossom", "react-ui", "r96util", "labels"]
media-compression = ["dep:ffmpeg-rs-raw", "dep:libc"]
labels = ["media-compression", "dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:hf-hub"]
cuda = ["labels", "candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
nip96 = ["media-compression"]
blossom = []
react-ui = []
payments = ["dep:payments-rs", "dep:fedimint-tonic-lnd"]
r96util = ["dep:walkdir", "dep:indicatif"]

[dependencies]
log = "0.4"
nostr = "0.44"
pretty_env_logger = "0.5"
axum = { version = "0.8", features = ["multipart", "macros"] }
axum-extra = { version = "0.12", features = ["file-stream"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs", "limit"] }
http-body-util = "0.1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "fs", "signal"] }
base64 = "0.22"
hex = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
anyhow = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["mysql", "runtime-tokio", "chrono", "uuid"] }
config = { version = "0.15", features = ["yaml", "async"] }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.13", features = ["stream", "http2", "json"] }
async-openai = { version = "0.34", features = ["chat-completion", "_api"] }
clap = { version = "4.5", features = ["derive"] }
mime2ext = "0.1"
infer = "0.19"
tokio-util = { version = "0.7", features = ["io", "io-util"] }
futures-util = "0.3"
url = "2"
notify = "8.2"
kamadak-exif = "0.6"
http-range-header = "0.4"
dashmap = "6"
bytes = "1"

image = { version = "0.25", default-features = false, features = ["webp", "jpeg"] }
image_hasher = "3"

libc = { version = "0.2", optional = true }
ffmpeg-rs-raw = { git = "https://github.com/v0l/ffmpeg-rs-raw.git", rev = "2594eceddf216807a254b87cff5df3e672c4a25b", optional = true }
candle-core = { git = "https://github.com/v0l/candle", rev = "bb4d7025db5d6ad43d0286849d5f3dfc993c7c84", optional = true }
candle-nn = { git = "https://github.com/v0l/candle", rev = "bb4d7025db5d6ad43d0286849d5f3dfc993c7c84", optional = true }
candle-transformers = { git = "https://github.com/v0l/candle", rev = "bb4d7025db5d6ad43d0286849d5f3dfc993c7c84", optional = true }
hf-hub = { version = "0.5", optional = true }
walkdir = { version = "2.5", optional = true }
indicatif = { version = "0.18", optional = true }
payments-rs = { git = "https://github.com/v0l/payments-rs.git", optional = true, rev = "60b0fbf3838385439fbd08d43565fb1d9ab810fb" }
fedimint-tonic-lnd = { git = "https://github.com/v0l/tonic_lnd.git", rev = "57fcd1ac2e8834c6f93cfa3c84ba67420a9dd3ed", default-features = false, features = ["lightningrpc", "invoicesrpc", "routerrpc"], optional = true }

[dev-dependencies]
tempfile = "3"
serde_json = "1"

[dependencies.serde_json]
version = "1"

